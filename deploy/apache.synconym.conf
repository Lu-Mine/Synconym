# 独立游戏入口，不改变服务器其他站点。
Listen 3000
<VirtualHost *:3000>
    ServerName example.com
    DocumentRoot "/opt/synconym-deploy/frontend-current"
    DirectoryIndex index.html
    ProxyRequests Off
    ProxyPreserveHost On
    ProxyPass /ws ws://127.0.0.1:3001/ws
    ProxyPassReverse /ws ws://127.0.0.1:3001/ws
    ProxyPass /api/ http://127.0.0.1:3001/api/
    ProxyPassReverse /api/ http://127.0.0.1:3001/api/
    ProxyPass /healthz http://127.0.0.1:3001/healthz
    ProxyPassReverse /healthz http://127.0.0.1:3001/healthz
    Alias /assets/ "/opt/synconym-deploy/frontend/"
    <Directory "/opt/synconym-deploy/frontend">
        Options FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>
    <Directory "/opt/synconym-deploy/frontend-current">
        Options FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>
    <Location />
        Header set Cache-Control "no-cache"
    </Location>
    <Location /assets/>
        Header set Cache-Control "public, max-age=31536000, immutable"
    </Location>
</VirtualHost>
