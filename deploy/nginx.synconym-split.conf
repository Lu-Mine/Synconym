# 前后端分离配置：静态文件由 Nginx 提供，游戏逻辑和 WebSocket 由 Node 处理。
# 前端文件通过符号链接指向独立版本目录,可原子切换而不重启 Node 服务。

# 下面这段必须放在 http { } 里，server 块之外
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name game.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name game.example.com;

    ssl_certificate     /etc/letsencrypt/live/game.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/game.example.com/privkey.pem;

    client_max_body_size 1m;

    # WebSocket 升级请求转发给 Node
    location = /ws {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # 健康检查转发给 Node
    location = /healthz {
        proxy_pass http://127.0.0.1:3000/healthz;
        proxy_set_header Host $host;
        access_log off;
    }

    # API 请求转发给 Node
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # 静态文件由 Nginx 直接提供
    # /opt/synconym-deploy/frontend-current 是指向特定前端版本的符号链接
    location / {
        root /opt/synconym-deploy/frontend-current;
        try_files $uri $uri/ /index.html;

        # 带 hash 的资源可以长期缓存
        location ~* \.(js|css|svg|json)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # HTML 不缓存，确保总能拿到最新版本
        location ~* \.html$ {
            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }
    }
}
