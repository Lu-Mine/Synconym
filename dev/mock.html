<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>交互模拟 · 近意词</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font: 14px/1.5 system-ui, sans-serif; color: #16161a; background: #f4f5f9; }
    .toolbar { position: fixed; top: 16px; right: 16px; z-index: 10; width: min(336px, calc(100vw - 24px)); max-height: calc(100dvh - 24px); display: flex; flex-direction: column; background: #fff; border: 1px solid #c9cfdc; border-radius: 12px; overflow: hidden; }
    .heading { display: flex; align-items: center; gap: 12px; padding: 12px 14px; background: #f8f9fc; border-bottom: 1px solid #e1e4ec; }
    .drag-handle { flex: 1; min-width: 0; cursor: grab; touch-action: none; user-select: none; }
    .drag-handle strong { display: block; font-size: 15px; }
    .drag-handle span { font-size: 12px; color: #505565; }
    .toolbar.dragging .drag-handle { cursor: grabbing; }
    .controls { overflow-y: auto; padding: 0 14px 14px; }
    .controls[hidden] { display: none; }
    .control-section { padding-top: 14px; }
    .control-section + .control-section { margin-top: 14px; border-top: 1px solid #e1e4ec; }
    h2 { margin: 0 0 10px; font-size: 13px; font-weight: 650; color: #505565; }
    .row { display: flex; align-items: center; gap: 8px; }
    .row + .row { margin-top: 8px; }
    .row > button, .row > select, .row > input { flex: 1; min-width: 0; }
    a { color: #3d5afe; text-underline-offset: 3px; }
    button, select, input { font: inherit; border: 1px solid #c9cfdc; border-radius: 7px; background: #fff; color: inherit; padding: 8px 10px; min-height: 38px; }
    button { cursor: pointer; }
    button:hover:not(:disabled) { border-color: #3d5afe; color: #2c47ea; }
    button:disabled, input:disabled, select:disabled { opacity: .45; cursor: not-allowed; }
    :is(button, select, input, a, .drag-handle):focus-visible { outline: 2px solid #3d5afe; outline-offset: 2px; }
    #start { background: #3d5afe; color: #fff; border-color: #3d5afe; }
    #status { margin: 0 0 10px; overflow-wrap: anywhere; }
    .switch-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 40px; cursor: pointer; }
    .switch-row input { appearance: none; flex: none; width: 40px; height: 24px; min-height: 0; padding: 2px; margin: 0; border-radius: 999px; background: #e1e4ec; border: 1px solid #a1a9ba; cursor: pointer; transition: background-color 150ms ease; }
    .switch-row input::before { content: ''; display: block; width: 18px; height: 18px; border-radius: 50%; background: #fff; transition: transform 150ms ease; }
    .switch-row input:checked { background: #3d5afe; border-color: #3d5afe; }
    .switch-row input:checked::before { transform: translateX(16px); }
    .panel-footer { display: flex; justify-content: space-between; gap: 12px; margin-top: 14px; font-size: 12px; color: #505565; }
    .preview { display: flex; justify-content: center; height: 100dvh; background: #e3e6ee; }
    iframe { display: block; width: 100%; height: 100%; border: 0; background: #f4f5f9; }
    .viewport-label { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    #viewport-value { color: #505565; font-variant-numeric: tabular-nums; }
    #viewport { display: block; width: 100%; margin: 8px 0 0; padding: 0; border: 0; accent-color: #3d5afe; cursor: pointer; }
    @media (prefers-reduced-motion: reduce) { .switch-row input, .switch-row input::before { transition: none; } }
  </style>
</head>
<body>
  <aside class="toolbar" id="mock-panel" aria-label="模拟控制面板">
    <div class="heading">
      <div class="drag-handle" id="drag-handle" tabindex="0" aria-label="移动模拟控制面板，拖动或使用方向键"><strong>模拟控制</strong><span>拖动移动 · 方向键微调</span></div>
      <button id="collapse" type="button" aria-expanded="true" aria-controls="panel-controls">收起</button>
    </div>
    <div class="controls" id="panel-controls">
      <section class="control-section"><h2>房间</h2>
        <p id="status" role="status">等待进入房间</p>
        <div class="row"><button id="add" type="button">添加玩家</button><button id="start" type="button">开始游戏</button></div>
      </section>
      <section class="control-section"><h2>模拟玩家</h2>
        <div class="row"><select id="player" aria-label="选择模拟玩家"></select><button id="remove" type="button">移除玩家</button></div>
        <label class="switch-row"><span>已准备</span><input id="ready" type="checkbox" role="switch"></label>
        <div class="row"><input id="word" aria-label="模拟玩家的词" placeholder="输入玩家的词" maxlength="12"><button id="submitWord" type="button">提交词</button></div>
        <div class="row"><button id="yes" type="button">同意</button><button id="no" type="button">否决</button></div>
        <div class="row"><button id="rematch" type="button">再来一局</button><button id="room" type="button">回房间</button></div>
      </section>
      <section class="control-section"><h2>阶段控制</h2>
        <label class="switch-row"><span>冻结倒计时</span><input id="pause" type="checkbox" role="switch"></label>
        <div class="row"><button id="back" type="button">上一阶段</button><button id="advance" type="button">下一阶段</button></div>
      </section>
      <section class="control-section"><h2>预览设置</h2>
        <label class="viewport-label" for="viewport"><span>预览宽度</span><output id="viewport-value" for="viewport"></output></label>
        <input id="viewport" type="range" min="320" max="1920" step="1" value="1920">
      </section>
      <div class="panel-footer"><span>模拟数据独立，重启清空</span><a href="/">返回游戏</a></div>
    </div>
  </aside>
  <div class="preview" id="preview"><iframe id="game" title="可交互的模拟游戏"></iframe></div>
  <script>document.getElementById('game').src = `/__mock/play${location.search}`;</script>
  <script type="module" src="/__mock/mock.js"></script>
</body>
</html>
