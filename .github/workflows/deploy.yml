name: Deploy Synconym
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: production-deploy
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Deploy
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST_KEY: ${{ secrets.DEPLOY_SSH_HOST_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/synconym_deploy
          chmod 600 ~/.ssh/synconym_deploy
          printf '%s\n' "$DEPLOY_HOST_KEY" > ~/.ssh/known_hosts
          trap 'rm -f ~/.ssh/synconym_deploy' EXIT
          ssh_opts=(-i ~/.ssh/synconym_deploy -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=10)
          # Infrastructure scripts are installed by an administrator, so compare them before touching production.
          infra=$(ssh "${ssh_opts[@]}" "root@$DEPLOY_HOST" checksum) || {
            echo 'Cannot read server deployment checksums; install deploy/ infrastructure files on the host first (see DEPLOY.md)' >&2
            exit 1
          }
          if ! ( cd deploy && printf '%s\n' "$infra" | sha256sum -c --strict --quiet ); then
            echo 'Server deployment infrastructure differs from this repository; reinstall deploy/ files before publishing' >&2
            exit 1
          fi
          archive="$RUNNER_TEMP/synconym.tar.gz"
          git archive --format=tar.gz "$GITHUB_SHA" > "$archive"
          checksum=$(sha256sum "$archive" | cut -d ' ' -f 1)
          # Re-query and reclassify on every retry: status and deploy are separate SSH sessions.
          for attempt in 1 2 3; do
            if current=$(ssh "${ssh_opts[@]}" "root@$DEPLOY_HOST" status); then
              [[ $current =~ ^([0-9a-f]{40})\ ([0-9a-f]{40})$ ]] || { echo 'Invalid deployed revisions (update server deploy script first)' >&2; exit 1; }
              frontend=${BASH_REMATCH[1]}
              backend=${BASH_REMATCH[2]}
              mode=$(bash deploy/github-deploy.sh --classify "$frontend" "$backend" "$GITHUB_SHA")
              case "$mode" in
                none) echo 'Already deployed'; exit 0 ;;
                stale) echo 'A newer revision is already deployed'; exit 0 ;;
                frontend|backend) ;;
                *) echo 'Invalid deployment classification' >&2; exit 1 ;;
              esac
              echo "Deploying $mode; frontend $frontend; backend $backend; attempt $attempt"
              if ssh "${ssh_opts[@]}" "root@$DEPLOY_HOST" "deploy $mode $GITHUB_SHA $checksum $frontend $backend" < "$archive"; then exit 0; fi
            fi
            if (( attempt < 3 )); then sleep $((attempt * 5)); fi
          done
          echo 'Deployment failed after three attempts' >&2
          exit 1
